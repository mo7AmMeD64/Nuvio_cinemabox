name: Build Android APK

# Builds the signed Android TV APK with the same steps as tools/android.sh on a
# computer: native curl/jpeg/webp (tools/android/deps.sh), SDL2 from source,
# the Media3 FFmpeg decoder, then gradle. The keystore is generated once and
# kept in the Actions cache so later builds install over earlier ones.
#
# Runs on pushes to main and by hand: Actions -> Build Android APK -> Run.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      NUVIO_RUST_MKVCORE: "0"
      NUVIO_P2P_MOTOR: none
      NUVIO_BUILD_JOBS: "4"
      NUVIO_ANDROID_JOBS: "4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "ndk;27.2.12479018" "cmake;3.22.1" \
            "build-tools;35.0.0" "platforms;android-35"

      # tools/tizen-art.sh converts the packaged art from webp to png.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Native dependencies and the SDL/FFmpeg sources take the longest; reuse
      # them. Saved separately so a failed build still leaves the cache.
      - name: Restore native dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nuvio-android
          key: android-deps-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-

      - name: Restore release keystore
        id: ks-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuvio-android
          key: android-keystore-v1

      - name: Prepare release keystore
        run: |
          mkdir -p "$HOME/.nuvio-android"
          if [ ! -f "$HOME/.nuvio-android/release.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.nuvio-android/release.jks" \
              -alias nuvio -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 \
              -storepass nuvio-cinemabox -keypass nuvio-cinemabox \
              -dname "CN=Nuvio CinemaBox, OU=Nuvio, O=Nuvio, L=Android, ST=Android, C=BR"
          fi
          printf '%s\n' \
            "NUVIO_KEYSTORE=$HOME/.nuvio-android/release.jks" \
            "NUVIO_KEYSTORE_PASS=nuvio-cinemabox" \
            "NUVIO_KEY_ALIAS=nuvio" \
            "NUVIO_KEY_PASS=nuvio-cinemabox" \
            > "$HOME/.nuvio-android/release.env"
          chmod 600 "$HOME/.nuvio-android/release.env" "$HOME/.nuvio-android/release.jks"

      - name: Build APK
        run: |
          set -o pipefail
          bash tools/android/deps.sh
          bash tools/android.sh --release-only 2>&1 | tee build-android.log

      - name: Save native dependencies cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nuvio-android
          key: android-deps-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}

      - name: Save release keystore
        if: always() && steps.ks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.nuvio-android
          key: android-keystore-v1

      - name: Show build error summary
        if: failure()
        run: |
          {
            echo '### Build failed - last 80 lines'
            echo '```'
            tail -n 80 build-android.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-CinemaBox-APK
          path: build/android/Nuvio-*-android.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CinemaBox build ${{ github.run_number }}
          body: |
            APK Android TV/Google TV gerado do commit ${{ github.sha }}.
          files: build/android/Nuvio-*-android.apk
          make_latest: true
